name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test Core
        run: dotnet test tests/WinTools.Core.Tests -c Release

      - name: Build Platform
        run: dotnet build src/WinTools.Platform -c Release

  app:
    name: App build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check formatting
        run: dotnet format WinTools.slnx --verify-no-changes

      - name: Build
        run: dotnet build src/WinTools.App -c Release

      - name: Check for vulnerable packages
        shell: pwsh
        run: |
          $out = dotnet list src/WinTools.App package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'has the following vulnerable packages') { exit 1 }
